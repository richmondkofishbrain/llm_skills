<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="story-token" content="__SERVE_TOKEN__">
<title>PR story</title>
<style>
:root {
  --bg: #f4f2ee; --dot: #d9d5cc; --panel: #ffffff; --ink: #1d232b; --muted: #6b7280; --line: #e3e0d8;
  --code-bg: #fbfaf8; --add-bg: #e6f6ea; --add-ink: #146c2e; --del-bg: #fdecec; --del-ink: #a1262b;
  --changed: #d98a1c; --context: #9aa3ad; --test: #7b5cc4; --ui: #2f7fd1; --edge: #8a8f98; --ok: #1f8a4c; --open: #c27a12;
  --kw: #a2399a; --ty: #23758a; --str: #b4471f; --num: #3b55c4; --com: #8b9099;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181d; --dot: #262b33; --panel: #1e2229; --ink: #e7e9ec; --muted: #9aa1ab; --line: #2d333c;
    --code-bg: #191c22; --add-bg: #15301f; --add-ink: #7fd69a; --del-bg: #3a1a1c; --del-ink: #f19a9d;
    --edge: #6c737e; --kw: #e08ad8; --ty: #6cc4d6; --str: #f0a37f; --num: #9fb0ff; --com: #7b818b;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #15181d; --dot: #262b33; --panel: #1e2229; --ink: #e7e9ec; --muted: #9aa1ab; --line: #2d333c;
  --code-bg: #191c22; --add-bg: #15301f; --add-ink: #7fd69a; --del-bg: #3a1a1c; --del-ink: #f19a9d;
  --edge: #6c737e; --kw: #e08ad8; --ty: #6cc4d6; --str: #f0a37f; --num: #9fb0ff; --com: #7b818b;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; overflow: hidden; }
a { color: var(--ui); }
code, pre, .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; }
:not(pre) > code { font-size: .92em; background: color-mix(in srgb, var(--ink) 7%, transparent); padding: 0 4px; border-radius: 4px; }

#app { display: grid; grid-template-columns: clamp(270px, 28vw, 340px) 1fr; height: 100vh; }
#app.collapsed { grid-template-columns: 0 1fr; }
#rail { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; overflow-x: hidden; padding: 20px 18px 40px; z-index: 2; }
#app.collapsed #rail { padding: 0; border: 0; }
#viewport { position: relative; overflow: hidden; cursor: grab; touch-action: none;
  background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 22px 22px; }
#viewport.dragging, #viewport.dragging * { cursor: grabbing !important; user-select: none !important; -webkit-user-select: none !important; }
#viewport.space, #viewport.space * { cursor: grab !important; user-select: none !important; -webkit-user-select: none !important; }
body.instant *, body.instant *::before { transition: none !important; }
#canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#canvas.animate { transition: transform .55s cubic-bezier(.2,.7,.2,1); }
#grid { position: relative; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

/* Rail */
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
h1 { font-size: 18px; line-height: 1.3; margin: 0 0 6px; }
.meta { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
.meta a { color: inherit; }
.intent { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 18px; }
.storyhead { display: flex; justify-content: space-between; align-items: baseline; }
.progress { font-size: 11.5px; color: var(--muted); }
.chapters { list-style: none; padding: 0; margin: 0 0 20px; }
.chapters li { border: 1px solid transparent; border-radius: 10px; padding: 9px 10px; cursor: pointer; margin-bottom: 4px; position: relative;
  display: grid; grid-template-columns: 28px 1fr; align-items: start; }
.chapters li:hover { background: var(--code-bg); }
.chapters li.active { border-color: var(--line); background: var(--code-bg); }
.chapters .n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--line); font-size: 11px; font-weight: 600; margin-top: 1px; }
.chapters li.active .n { background: var(--ink); color: var(--panel); }
.chapters li.done .n { background: var(--ok); color: #fff; }
.chapters .t { font-weight: 600; }
.chapters li.done:not(.active) .t { color: var(--muted); }
.chapters .s { grid-column: 2; color: var(--muted); font-size: 12.5px; margin: 4px 0 0; display: none; }
.chapters li.active .s { display: block; }
.chapters .tick { grid-column: 2; justify-self: start; margin: 8px 0 0; display: none; font-size: 12px; color: var(--muted); align-items: center; gap: 6px; cursor: pointer; }
.chapters li.active .tick { display: inline-flex; }
.checks { list-style: none; padding: 0; margin: 0; }
.checks li { padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.badge { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; margin-right: 6px; }
.badge.verified { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.badge.open { background: color-mix(in srgb, var(--open) 18%, transparent); color: var(--open); }
.checks .why { color: var(--muted); font-size: 12px; margin-top: 3px; }
.coverage { font-size: 12.5px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); margin: 0 0 20px; display: flex; gap: 8px; align-items: flex-start; }
.coverage .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--ok); }
.coverage.bad .dot { background: var(--del-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); margin: 6px 0 20px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.hint { color: var(--muted); font-size: 12px; margin-top: 18px; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-size: 11px; font-family: inherit; }

/* Toolbar */
#toolbar { position: absolute; right: 16px; top: 16px; display: flex; gap: 6px; z-index: 3; }
#toolbar.left { left: 16px; right: auto; }
.tb { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12.5px; cursor: pointer; box-shadow: var(--shadow); }
.tb:hover { border-color: var(--muted); }
#chapter-chip { position: absolute; left: 16px; bottom: 16px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow);
  border-radius: 999px; padding: 6px 14px; font-size: 12.5px; z-index: 3; display: none; white-space: nowrap; max-width: calc(100% - 240px); overflow: hidden; text-overflow: ellipsis; }

/* Minimap */
#minimap { position: absolute; right: 16px; bottom: 16px; width: 190px; height: 120px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow); z-index: 3; overflow: hidden; cursor: crosshair; }
#minimap svg { width: 100%; height: 100%; display: block; }
#minimap .mm-node { fill: var(--line); }
#minimap .mm-node.lit { fill: var(--muted); }
#minimap .mm-node.rev { fill-opacity: .35; }
#minimap .mm-view { fill: color-mix(in srgb, var(--ui) 10%, transparent); stroke: var(--ui); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
#chapter-chip b { margin-right: 6px; }

/* Nodes */
.node { cursor: auto; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--role); border-radius: 12px; box-shadow: var(--shadow); transition: opacity .35s, filter .35s, box-shadow .2s; position: absolute; z-index: 1; }
/* Only the review tag fades a box, and it fades the contents, not the tag itself. */
.node > header, .node > .body { transition: opacity .25s, filter .25s; }
.node.reviewed > header, .node.reviewed > .body { opacity: .4; filter: grayscale(.5); }
.node.stub { --role: var(--g); }
.node.stub header { cursor: pointer; }
.stub-list { margin: 0 0 10px; padding-left: 18px; font-size: 12.5px; color: var(--muted); }
.stub-list li { margin-bottom: 3px; }
.rail-hide { float: right; margin: -6px -6px 0 10px; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
  color: var(--muted); font-size: 15px; cursor: pointer; }
.rail-hide:hover, .rail-show:hover { color: var(--ink); border-color: var(--muted); }
.rail-show { position: absolute; left: 16px; top: 16px; z-index: 3; display: none; font-size: 15px; }
#app.collapsed .rail-show { display: block; }
.node.inch { box-shadow: 0 0 0 2px color-mix(in srgb, var(--role) 50%, transparent), var(--shadow); }
.node .kind-right { display: flex; gap: 6px; align-items: center; }
.node .rv { position: absolute; top: -12px; right: 14px; z-index: 2; height: 23px; padding: 0 10px 0 7px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel); color: var(--muted); font: 600 11px/1 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; box-shadow: var(--shadow);
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
.node .rv .bx { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid currentColor; display: inline-grid; place-items: center; font-size: 9px; line-height: 1; }
.node.reviewed .rv .bx { background: #fff; border-color: #fff; color: var(--ok); }
.node .rv:hover { border-color: var(--ok); color: var(--ok); }
.node.reviewed .rv { background: var(--ok); border-color: var(--ok); color: #fff; }
.node .cm-pill { font-size: 10px; letter-spacing: 0; text-transform: none; color: var(--ui); font-weight: 600; }
.node.spot { box-shadow: 0 0 0 3px color-mix(in srgb, var(--role) 35%, transparent), var(--shadow); }
.node header { padding: 15px 14px 8px; border-bottom: 1px solid var(--line); cursor: zoom-in; }
.node .kind { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--role); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.node .pills { display: flex; gap: 3px; }
.node .pill.on { background: var(--role); color: #fff; }
.node .pill { font-size: 10px; min-width: 16px; height: 16px; border-radius: 8px; display: inline-grid; place-items: center; background: var(--line); color: var(--muted); padding: 0 4px; letter-spacing: 0; }
.node h3 { margin: 2px 0 0; font-size: 14.5px; }
.node .file { font-size: 11.5px; color: var(--muted); margin-top: 2px; word-break: break-all; }
.node .file a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); }
.node .file a:hover { color: var(--ui); border-color: var(--ui); }
.node .body { padding: 10px 14px 12px; }
.node .note { margin: 0 0 8px; font-size: 13px; }
.node .note.muted { color: var(--muted); }
.role-changed { --role: var(--changed); }
.role-context { --role: var(--context); }
.role-test { --role: var(--test); }
.role-ui { --role: var(--ui); }
.role-warn { --role: var(--del-ink); }
pre.hunk { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 0; font-size: 12px; line-height: 1.6; }
pre.hunk > div { white-space: normal; display: grid; grid-template-columns: 34px 14px 1fr; padding-right: 12px; }
pre.hunk { tab-size: 4; }
/* Leading whitespace sits in its own box, so a wrapped line continues under its own code. */
pre.hunk .tx { display: flex; min-width: 0; }
pre.hunk .ind { white-space: pre; flex: none; }
pre.hunk .rest { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; flex: 1; }
pre.hunk .ln { color: var(--muted); opacity: .6; text-align: right; padding-right: 6px; user-select: none; }
pre.hunk .sg { color: var(--muted); user-select: none; }
pre.hunk .add { background: var(--add-bg); }
pre.hunk .add .sg { color: var(--add-ink); }
pre.hunk .del { background: var(--del-bg); }
pre.hunk .del .sg { color: var(--del-ink); }
pre.hunk .del .tx { opacity: .75; }
pre.hunk .gap { color: var(--muted); opacity: .6; }
/* Expand rows, like GitHub's: a tinted row whose gutter holds the expand buttons. */
pre.hunk > div.xp { grid-template-columns: 48px 1fr; background: color-mix(in srgb, var(--ui) 9%, transparent); }
pre.hunk > div.xp:first-child { margin-top: -6px; border-radius: 7px 7px 0 0; }
pre.hunk > div.xp:last-child { margin-bottom: -6px; border-radius: 0 0 7px 7px; }
pre.hunk .xg { display: flex; flex-direction: column; background: color-mix(in srgb, var(--ui) 18%, transparent); border-radius: inherit; }
pre.hunk .xg button { display: flex; align-items: center; justify-content: center; height: 22px; padding: 0; border: 0;
  background: none; color: var(--ui); cursor: pointer; border-radius: inherit; }
pre.hunk .xg button:hover { background: var(--ui); color: #fff; }
pre.hunk .xg svg { width: 16px; height: 16px; fill: currentColor; }
pre.hunk .xp .ct { align-self: center; padding-left: 10px; color: var(--muted); font-size: 11.5px; }
pre.hunk .ln.cm { cursor: pointer; }
pre.hunk .ln.cm:hover { color: var(--ui); opacity: 1; text-decoration: underline; }
pre.hunk .ln.has { color: var(--ui); opacity: 1; font-weight: 700; }
pre.hunk > div.rsel { box-shadow: inset 3px 0 0 var(--ui);
  background-image: linear-gradient(color-mix(in srgb, var(--ui) 14%, transparent), color-mix(in srgb, var(--ui) 14%, transparent)); }
.thread { white-space: normal; font: 12.5px/1.45 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; margin: 4px 10px 8px 48px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
.cmt { padding: 7px 10px; border-top: 1px solid var(--line); }
.cmt:first-child { border-top: 0; }
.cmt .hd { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.cmt .who { font-weight: 600; }
.cmt .when, .cmt .acts { color: var(--muted); font-size: 11px; }
.cmt .acts { margin-left: auto; display: flex; gap: 8px; }
.cmt .acts a, .cmt .acts button { color: var(--ui); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: none; }
.cmt .b { margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
.thread.folded .cmt .b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
.thread-toggle { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: var(--code-bg); color: var(--ui);
  font: 600 11.5px/1 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; padding: 7px 10px; cursor: pointer; }
.cmt.draft { background: color-mix(in srgb, var(--open) 9%, transparent); }
.cmt.pending { background: color-mix(in srgb, var(--ui) 7%, transparent); }
.composer { padding: 8px 10px; }
.composer textarea, .review-box textarea { width: 100%; min-height: 70px; resize: vertical; font: inherit; color: var(--ink); background: var(--code-bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.composer .row, .review-box .row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; align-items: center; }
.composer .row .tip { margin-right: auto; color: var(--muted); font-size: 11px; }
.btn { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn.warn { background: var(--open); border-color: var(--open); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.tx .kw { color: var(--kw); } .tx .ty { color: var(--ty); } .tx .st { color: var(--str); } .tx .nu { color: var(--num); } .tx .co { color: var(--com); font-style: italic; } .tx .at { color: var(--kw); }

.same { margin-top: 10px; font-size: 12.5px; }
.same summary { cursor: pointer; color: var(--ui); font-weight: 600; }
.same-item { margin-top: 8px; }
.same-item .file { font-size: 11.5px; color: var(--muted); margin-bottom: 3px; word-break: break-all; }
.same-item .file a { color: inherit; }

/* Journey */
.steps { display: flex; flex-direction: column; gap: 6px; }
.step { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.step .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--ui) 14%, transparent); color: var(--ui); font-size: 11px; font-weight: 700; flex: none; }
.step.final .dot { background: var(--ui); color: #fff; }

/* Snapshots */
.snaps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.snaps .name { grid-column: 1 / -1; font-size: 12px; font-weight: 600; margin-top: 4px; }
.snaps figure { margin: 0; }
.snaps figcaption { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
.snaps img { width: 100%; display: block; border-radius: 6px; border: 1px solid var(--line); cursor: zoom-in; background: repeating-conic-gradient(var(--line) 0 25%, transparent 0 50%) 0 0 / 12px 12px; }
.snaps .none { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 18px 8px; text-align: center; }
.snaps .hint2 { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); }

/* Glue */
.glue ul { margin: 0; padding-left: 18px; font-size: 12.5px; }
.glue li { margin-bottom: 4px; word-break: break-all; }
.glue .ct { color: var(--muted); }

/* Edge labels */
.elabel { position: absolute; transform: translate(-50%, -50%); background: var(--bg); color: var(--muted); font-size: 11.5px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); white-space: nowrap; pointer-events: none; transition: opacity .35s; z-index: 2; }
.elabel.dim { opacity: .15; }
path.edge { fill: none; stroke: var(--edge); stroke-width: 1.6; transition: opacity .35s; }
path.edge.dim { opacity: .12; }
path.edge.hot { stroke: var(--ink); stroke-width: 2.5; }

.frame { position: absolute; border: 1.5px solid color-mix(in srgb, var(--g) 38%, transparent); background: color-mix(in srgb, var(--g) 6%, transparent);
  border-radius: 22px; pointer-events: none; z-index: 0; transition: opacity .35s; }
.frame.active { border: 2.5px solid var(--g); background: color-mix(in srgb, var(--g) 9%, transparent);
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--g) 12%, transparent); }
/* Group header: title, Review tick and collapse toggle on one row, the summary beneath. */
.frame .ghead { position: absolute; top: 12px; left: 16px; right: 16px; pointer-events: auto; }
.ghead .gtop { display: flex; align-items: center; gap: 8px; }
.ghead .gacts { margin-left: auto; display: flex; gap: 6px; }
.ghead button { height: 24px; padding: 0 10px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--g) 45%, transparent); background: var(--panel);
  color: var(--g); font: 600 11px/1 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.ghead .grv .bx { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid currentColor; display: inline-grid; place-items: center; font-size: 9px; line-height: 1; }
.ghead .grv.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.ghead .grv.on .bx { background: #fff; border-color: #fff; color: var(--ok); }
.ghead .gs { margin-top: 8px; font-size: 13.5px; line-height: 1.45; color: color-mix(in srgb, var(--ink) 82%, transparent); max-width: 820px; }
.ghead .gt { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--g);
  background: color-mix(in srgb, var(--g) 14%, var(--bg)); }
:root { --g-blue: #2f7fd1; --g-violet: #7b5cc4; --g-teal: #1f9488; --g-amber: #c9831a; --g-rose: #c44f6a; --g-green: #3d9a4b; --g-slate: #6b7686; }

/* Review panel */
.review-box { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 20px; font-size: 12.5px; }
.review-box p { margin: 0 0 6px; }
.review-box .muted { color: var(--muted); }
.review-box .err { color: var(--del-ink); }
.unplaced { list-style: none; padding: 0; margin: 6px 0 0; font-size: 12px; }
.unplaced li { padding: 4px 0; border-top: 1px solid var(--line); }

/* Lightbox */
#lightbox { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px); z-index: 10; display: none; place-items: center; padding: 24px; }
#lightbox.on { display: grid; }
#lightbox .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; max-width: min(1100px, 100%); width: 100%; }
#lightbox .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 13px; }
#lightbox .cmp { position: relative; user-select: none; touch-action: none; cursor: ew-resize; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
#lightbox .cmp img { display: block; width: 100%; }

<body>
<div id="app">

  <main id="viewport">

      <button class="tb" id="btn-overview" title="Show everything (0)">Overview</button>
      <button class="tb" id="btn-prev" title="Previous chapter (←)">←</button>
      <button class="tb" id="btn-next" title="Next chapter (→)">→</button>
      <button class="tb" id="btn-theme" title="Toggle page theme">Theme</button>
    </div>

</div>

<script id="story" type="application/json">__STORY_JSON__</script>
<script>
const story = JSON.parse(document.getElementById("story").textContent);
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")

const DRAFT_FIELDS = ["drafts", "sent", "reviewBody", "reviewURL"];
const store = {
  key: `pr-story:${story.pr.number ?? story.pr.headRef}:${story.pr.head}`,
  draftKey: `pr-story-drafts:${story.pr.number ?? story.pr.headRef}`,
  read(key) { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; } },
  get() { return { ...this.read(this.key), ...this.read(this.draftKey) }; },
  set(v) {
    const drafts = Object.fromEntries(DRAFT_FIELDS.filter(f => f in v).map(f => [f, v[f]]));
    const rest = Object.fromEntries(Object.entries(v).filter(([f]) => !DRAFT_FIELDS.includes(f)));
    try {

    } catch {}

// Drafts saved under the old per-commit key move to the per-PR one.

  const old = store.read(store.key);

})();
const canvas = $("#canvas"), grid = $("#grid"), viewport = $("#viewport"), svg = $("#edges");
const TOKEN = $('meta[name="story-token"]').content;
const storyDir = location.pathname.split("/").filter(Boolean).slice(-2, -1)[0];
// The API exists only when serve.py handed out this page (it fills in the token).
const api = TOKEN.startsWith("__") || !story.pr.number ? null : {
  async call(path, init = {}) {
    const res = await fetch(`/api/${storyDir}/${path}`, { ...init, headers: { "X-Story-Token": TOKEN, "Content-Type": "application/json", ...(init.headers || {}) } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  },
};
let comments = story.comments || [];
let composerKey = null, renderedKeys = new Set();
const lineKey = (path, side, line) => `${path}|${side}|${line}`;
function threadIndex() {
  const byId = Object.fromEntries(comments.map(c => [c.id, c]));
  const index = {};
  for (const c of comments) {
    const root = (c.replyTo && byId[c.replyTo]) || c;
    if (root.line == null) continue;
    ((index[lineKey(root.path, root.side, root.line)] ||= {})[root.id] ||= []).push({ ...c, kind: "github" });
  }
  const state = store.get();
  for (const d of state.drafts || []) ((index[lineKey(d.path, d.side, d.line)] ||= {})["draft"] ||= []).push({ ...d, kind: "draft" });
  return index;
}
// GitHub threads start folded to a two-line preview, so long bot reviews don't stretch the box.
const expandedThreads = new Set();
function threadHTML(root, list) {
  const folded = !expandedThreads.has(root) && list[0].kind === "github" && !list[0].pending;
  const replies = list.length - 1;
  const toggle = list[0].kind === "github" && !list[0].pending
    ? `<button class="thread-toggle" data-thread="${esc(root)}">${folded ? (replies ? `Show thread · ${replies} ${replies === 1 ? "reply" : "replies"}` : "Show comment") : "Fold"}</button>` : "";
  const shown = folded ? [list[0]] : list;
  return `<aside class="thread${folded ? " folded" : ""}" data-interactive>${shown.map(commentHTML).join("")}${toggle}</aside>`;
}
// Bot reviews carry badges, HTML comments and tags; keep their words only.
const cleanBody = body => body
  .replace(/<!--[\s\S]*?-->/g, "")
  .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
  .replace(/<[^>]+>/g, "")
  .replace(/^#+\s*/gm, "")
  .replace(/\n{3,}/g, "\n\n")
  .trim();
const when = iso => iso ? new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
const rangeLabel = c => c.startLine && c.startLine !== c.line ? `<span class="when">lines ${c.startLine}–${c.line}</span>` : "";
let confirmingDelete = null;
function commentHTML(c) {
  const pendingActs = () => confirmingDelete === c.nodeId
    ? `<span class="acts"><button data-rdel="${esc(c.nodeId)}" style="color:var(--del-ink)">Confirm delete</button><button data-rdel-cancel>Keep</button></span>`
    : `<span class="acts"><button data-redit="${esc(c.nodeId)}">Edit</button><button data-rdel="${esc(c.nodeId)}">Delete</button></span>`;
  if (c.kind === "github" && c.pending) {
    return `<div class="cmt pending"><div class="hd"><span class="who">You</span><span class="badge open" title="Only you can see this until you submit your review on GitHub">pending</span>${rangeLabel(c)}${pendingActs()}</div>
      <div class="b">${md(c.body)}</div></div>`;
  }
  const head = c.kind === "github"
    ? `<span class="who">${esc(c.user)}</span>${rangeLabel(c)}<span class="when">${when(c.created)}</span><span class="acts"><a href="${esc(c.url)}" target="_blank" rel="noopener">Reply on GitHub</a></span>`
    : c.kind === "draft"
      ? `<span class="who">You</span><span class="badge open">draft</span>${rangeLabel(c)}<span class="acts"><button data-edit="${esc(c.id)}">Edit</button><button data-del="${esc(c.id)}">Delete</button></span>`
      : "";

}
const nodeById = Object.fromEntries(story.nodes.map(n => [n.id, n]));

// ---- Groups --------------------------------------------------------------
// A group is a colored region around boxes that belong together. Its header shows a summary, a
// Review tick for every box inside and a collapse toggle; a collapsed group shrinks to one stub box.
const groups = (story.groups || []).map((g, i) => ({ ...g, i, id: `__g${i}` }));
const groupOfNode = {};
groups.forEach(g => g.nodes.forEach(id => { groupOfNode[id] ||= g; }));
// Groups a chapter opened for this visit only; only the reader's own clicks are remembered.
const openedForChapter = new Set();
function isCollapsed(g) {
  if (openedForChapter.has(g.id)) return false;
  const saved = store.get().collapsedGroups || {};
  return g.id in saved ? saved[g.id] : !!g.collapsed;
}
function setCollapsed(g, on) {
  openedForChapter.delete(g.id);
  const s = store.get();
  s.collapsedGroups = { ...(s.collapsedGroups || {}), [g.id]: on };
  store.set(s);
}
const hiddenNode = id => !!groupOfNode[id] && isCollapsed(groupOfNode[id]);
// The box that stands for an id on the canvas: the box itself, or its collapsed group's stub.
const shown = id => hiddenNode(id) ? groupOfNode[id].id : id;
const shownIds = ids => [...new Set(ids.map(shown))];
// What gets placed: every visible box, plus one stub per collapsed group, in its first box's spot.
function layoutItems() {
  const own = (id, n) => n && n !== id ? n : undefined;
  const items = story.nodes.filter(n => !hiddenNode(n.id))
    .map(n => ({ id: n.id, col: n.col, row: n.row, alignWith: own(n.id, n.alignWith && shown(n.alignWith)), after: own(n.id, n.after && shown(n.after)) }));
  for (const g of groups.filter(isCollapsed)) {
    const first = g.nodes.map(id => nodeById[id]).filter(Boolean).sort((a, b) => a.col - b.col || a.row - b.row)[0];
    if (first) items.push({ id: g.id, col: first.col, row: first.row,
      alignWith: own(g.id, first.alignWith && shown(first.alignWith)), after: own(g.id, first.after && shown(first.after)) });
  }
  return items;
}
function applyCollapse() {
  story.nodes.forEach(n => { $("#node-" + n.id).style.display = hiddenNode(n.id) ? "none" : ""; });
  groups.forEach(g => { $("#node-" + g.id).style.display = isCollapsed(g) ? "" : "none"; });
}
function toggleGroup(g, open = isCollapsed(g)) {
  setCollapsed(g, !open);
  layout();
}
function toggleGroupReviewed(g) {
  const s = store.get(), reviewed = { ...(s.reviewed || {}) };
  const all = g.nodes.every(id => reviewed[id]);
  g.nodes.forEach(id => { reviewed[id] = !all; });
  if (all && s.done) story.chapters.forEach((c, i) => { if (c.nodes.some(id => g.nodes.includes(id))) s.done[i] = false; });
  s.reviewed = reviewed;
  store.set(s);
  syncReviewed();
}
const chaptersOf = id => story.chapters.map((c, i) => c.nodes.includes(id) ? i + 1 : null).filter(Boolean);

if (story.pr.number) document.title = `PR ${story.pr.number} story`;

// ---- Code ----------------------------------------------------------------
// Every file gets the shared rules: strings, numbers and the literals below. A file's language,
// picked by its name, adds its comment syntax, keywords, attributes, and whether a capitalised
// word is a type. A file in no language gets the shared rules only, so nothing is guessed.
const words = list => new Set(list.split(" "));
const LITERALS = words("true false null nil");
const LANGUAGES = {
  swift: { line: "//", block: true, quotes: `"`, attributes: true, types: true, keywords: words(
    "associatedtype actor async await break case catch class continue convenience default defer deinit do else enum " +
    "extension fallthrough fileprivate final for func guard if import in init inout internal is lazy let mutating nonisolated " +
    "open operator override private protocol public repeat required rethrows return self Self some any static struct subscript super " +
    "switch throw throws try typealias var weak where while unowned get set willSet didSet") },
  js: { line: "//", block: true, quotes: "\"'`", attributes: true, types: true, keywords: words(
    "as async await break case catch class const continue debugger declare default delete do else enum export extends finally for " +
    "from function get if implements import in instanceof interface keyof let namespace new of private protected public readonly " +
    "return set static super switch this throw try type typeof undefined var void while yield") },
  ruby: { line: "#", quotes: `"'`, types: true, keywords: words(
    "alias and attr_accessor attr_reader begin break case class def do else elsif end ensure for if in lambda module next not or " +
    "private proc protected raise require require_relative rescue return self then unless until when while yield") },
  python: { line: "#", quotes: `"'`, attributes: true, types: true, keywords: words(
    "and as assert async await break class continue def del elif else except finally for from global if import in is lambda " +
    "nonlocal not or pass raise return self try while with yield None True False") },
  shell: { line: "#", quotes: `"'`, keywords: words(
    "case do done echo elif else esac exit export fi for function if in local readonly return set shift source then until while") },
  yaml: { line: "#", quotes: `"'` },
  graphql: { line: "#", quotes: `"`, attributes: true, types: true, keywords: words(
    "directive enum extend fragment implements input interface mutation on query scalar schema subscription type union") },
  strings: { block: true, quotes: `"` },
  json: { quotes: `"` },
};
const EXTENSIONS = {
  swift: "swift", js: "js", mjs: "js", cjs: "js", jsx: "js", ts: "js", tsx: "js", rb: "ruby", rake: "ruby", gemspec: "ruby",
  py: "python", sh: "shell", bash: "shell", zsh: "shell", yml: "yaml", yaml: "yaml", graphql: "graphql", gql: "graphql",
  strings: "strings", json: "json",
};
const FILENAMES = { Gemfile: "ruby", Podfile: "ruby", Fastfile: "ruby", Appfile: "ruby", Matchfile: "ruby", Pluginfile: "ruby",
  Dangerfile: "ruby", Rakefile: "ruby", Brewfile: "ruby" };
const PLAIN = { quotes: `"` };
function languageOf(path) {
  const name = (path || "").split("/").pop();
  return LANGUAGES[Object.hasOwn(FILENAMES, name) ? FILENAMES[name] : EXTENSIONS[name.includes(".") && name.split(".").pop()]] || PLAIN;
}
const patterns = new Map();
// One regex per language; the groups are comment, string, attribute, number, word.
function patternFor(lang) {

      lang.block && String.raw`\/\*.*?(?:\*\/|$)`].filter(Boolean);
    const strings = [...lang.quotes].map(q => `${q}(?:[^${q}\\\\]|\\\\.)*${q}`);
    patterns.set(lang, new RegExp(`(${comments.join("|") || "(?!)"})|(${strings.join("|")})|(${lang.attributes ? String.raw`@\w+` : "(?!)"})|` +
      String.raw`\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)\b`, "g"));

  const re = patternFor(lang);

  let out = "", last = 0, m;
  while ((m = re.exec(text))) {
    out += esc(text.slice(last, m.index));
    const [tok] = m;
    if (m[1]) out += `<span class="co">${esc(tok)}</span>`;
    else if (m[2]) out += `<span class="st">${esc(tok)}</span>`;
    else if (m[3]) out += `<span class="at">${esc(tok)}</span>`;
    else if (m[4]) out += `<span class="nu">${tok}</span>`;
    else if (lang.keywords?.has(tok) || LITERALS.has(tok)) out += `<span class="kw">${tok}</span>`;
    else if (lang.types && /^[A-Z]/.test(tok)) out += `<span class="ty">${tok}</span>`;

// ---- Expanding excerpts ----------------------------------------------------
// Like GitHub's expand arrows: reveal more of the file above, below or between an excerpt's ranges.
const EXPAND_STEP = 20;
const excerptOwners = Object.fromEntries(story.nodes.filter(n => n.kind === "code")
  .flatMap(n => [n, ...(n.same || [])]).map(m => [m.id, m]));
// Rebuilds an excerpt from its spans (indices into the file's lines), merging spans that touch.
function rebuildExcerpt(m) {
  const source = story.sources?.[m.file];
  if (!source || !m.spans?.length) return;
  const merged = [];
  for (const [a, b] of [...m.spans].sort((x, y) => x[0] - y[0])) {
    const last = merged.at(-1);
    last && a <= last[1] + 1 ? last[1] = Math.max(last[1], b) : merged.push([a, b]);
  }
  m.spans = merged;
  m.excerpt = merged.flatMap(([a, b], i) =>

Object.values(excerptOwners).forEach(rebuildExcerpt);
// Grows span `k` upward or downward by up to `count` lines, never past its neighbours or the file.
function expandExcerpt(id, k, direction, count = EXPAND_STEP) {
  const m = excerptOwners[id], spans = m.spans, length = story.sources[m.file].length;
  if (direction === "up") spans[k][0] = Math.max(k ? spans[k - 1][1] + 1 : 0, spans[k][0] - count);
  else spans[k][1] = Math.min(k + 1 < spans.length ? spans[k + 1][0] - 1 : length - 1, spans[k][1] + count);
  rebuildExcerpt(m);
  refreshCode();
}
// An arrow and a dashed line: up reveals lines above, down lines below, and both close a gap.
const EXPAND_ICONS = {
  up: `<path d="M8 1.5 4 5.5h2.75V9h2.5V5.5H12z"/><path d="M1 12.25h2v1.5H1zm4 0h2v1.5H5zm4 0h2v1.5H9zm4 0h2v1.5h-2z"/>`,
  down: `<path d="M8 14.5 4 10.5h2.75V7h2.5v3.5H12z"/><path d="M1 2.25h2v1.5H1zm4 0h2v1.5H5zm4 0h2v1.5H9zm4 0h2v1.5h-2z"/>`,
  all: `<path d="M8 0 4.5 3.5h2.25V6h2.5V3.5h2.25zm0 16-3.5-3.5h2.25V10h2.5v2.5h2.25z"/><path d="M1 7.25h2v1.5H1zm4 0h2v1.5H5zm4 0h2v1.5H9zm4 0h2v1.5h-2z"/>`,
};
function expanderHTML(id, k, direction, hidden, icon = direction) {
  const count = Math.min(hidden, EXPAND_STEP);
  const title = icon === "all" ? `Show the ${count} hidden ${count === 1 ? "line" : "lines"}`
    : `Show ${count} more ${count === 1 ? "line" : "lines"} ${direction === "up" ? "above" : "below"}`;
  return `<button data-xp="${esc(id)}" data-k="${k}" data-dir="${direction}" data-count="${count}" title="${title}" aria-label="${title}">

}
function expanderRow(buttons, text) {
  return `<div class="gap xp" data-interactive><span class="xg">${buttons}</span><span class="ct">${text}</span></div>`;
}
function hunkHTML(lines, file, threads = {}, id) {
  const lang = languageOf(file);
  const m = id && excerptOwners[id];
  const source = m && story.sources?.[m.file];
  let top = "", bottom = "";
  if (source) {
    const above = m.spans[0][0], below = source.length - 1 - m.spans.at(-1)[1];
    if (above) top = expanderRow(expanderHTML(id, 0, "up", above), `${above} ${above === 1 ? "line" : "lines"} above`);
    if (below) bottom = expanderRow(expanderHTML(id, m.spans.length - 1, "down", below), `${below} ${below === 1 ? "line" : "lines"} below`);
  }
  let inRange = false;
  return `<pre class="hunk">${top}${lines.map(l => {
    if (l.t === "gap" && source && l.hidden) return expanderRow(l.hidden <= EXPAND_STEP
      ? expanderHTML(id, l.span - 1, "down", l.hidden, "all")
      : expanderHTML(id, l.span - 1, "down", l.hidden) + expanderHTML(id, l.span, "up", l.hidden),
      `${l.hidden} hidden ${l.hidden === 1 ? "line" : "lines"}`);
    if (l.t === "gap") return `<div class="gap"><span class="ln"></span><span class="sg"></span><span>⋯</span></div>`;
    const sign = { add: "+", del: "−", ctx: "" }[l.t];
    const num = l.t === "del" ? l.o : l.n;
    const [, indent, rest] = l.text.match(/^(\s*)(.*)$/s);
    const side = l.t === "del" ? "LEFT" : "RIGHT";
    const key = file && lineKey(file, side, num);
    const lineThreads = key && threads[key];
    if (lineThreads) renderedKeys.add(key);
    const commentable = file && l.c && story.pr.number;
    const ln = `<span class="ln${commentable ? " cm" : ""}${lineThreads ? " has" : ""}"${commentable
      ? ` data-key="${esc(key)}" data-h="${l.c}" title="Comment on this line, or drag to comment on several"` : ""}>${num ?? ""}</span>`;
    // Rows of the range the composer is open for stay highlighted.
    if (composerRange && key === composerRange.startKey) inRange = true;
    const selected = inRange && composerRange;
    if (composerRange && key === composerKey) inRange = false;
    const row = `<div class="${l.t}${selected ? " rsel" : ""}">${ln}<span class="sg">${sign}</span><span class="tx"><span class="ind">${indent}</span><span class="rest">${highlight(rest, lang)}</span></span></div>`;
    const thread = lineThreads ? Object.entries(lineThreads).map(([root, list]) => threadHTML(root, list)).join("") : "";

}
function composerHTML(key) {
  const draft = (store.get().drafts || []).find(d => d.id === editingDraft);
  const remote = comments.find(c => c.nodeId && c.nodeId === editingRemote);
  const text = composerText ?? draft?.body ?? remote?.body ?? "";
  const label = saving ? "Saving…" : remote ? "Update comment" : draft ? "Update draft" : api ? "Add to pending review" : "Save draft";
  return `<aside class="thread composer" data-interactive><textarea placeholder="Leave a comment" data-key="${esc(key)}"${saving ? " disabled" : ""}>${esc(text)}</textarea>
    ${composerError ? `<p class="err" style="margin:6px 0 0;font-size:12px">${esc(composerError)}</p>` : ""}
    <div class="row"><span class="tip">${api && !draft ? "Only you see it until you submit your review on GitHub · " : ""}⌘↩ adds it · Esc cancels</span>
      <button class="btn" data-cancel>Cancel</button><button class="btn primary" data-save${saving ? " disabled" : ""}>${label}</button></div></aside>`;

let editingDraft = null;
// A pending GitHub comment being edited, the text typed so far (kept across re-renders), and
// whether a save is in flight.
let editingRemote = null, composerText = null, saving = false, composerError = "";
function closeComposer() {
  composerKey = null; composerRange = null; editingDraft = null; editingRemote = null; composerText = null; composerError = "";
}
// A multi-line comment: from startKey down to composerKey, as GitHub's start_line and line.
let composerRange = null;

// ---- Nodes ---------------------------------------------------------------
// Code boxes widen to fit their longest line, up to this many characters; longer lines wrap.
const MAX_CODE_COLUMNS = 150;
let charWidth;
function codeWidth(n) {
  const lines = [n, ...(n.same || [])].flatMap(m => m.excerpt || []).filter(l => l.t !== "gap");
  const longest = Math.max(0, ...lines.map(l => l.text.replace(/\t/g, "    ").length));
  if (!charWidth) {
    const ctx = document.createElement("canvas").getContext("2d");
    ctx.font = `12px "SF Mono", ui-monospace, Menlo, monospace`;
    charWidth = ctx.measureText("0".repeat(100)).width / 100;

  const chrome = 28 + 2 + 48 + 12 + 5 + 8; // body padding, pre border, gutter, right padding, node borders, slack

  const target = fromHash >= 1 && fromHash <= story.chapters.length ? fromHash - 1 : state.chapter;
  const resume = Number.isInteger(target) && target >= 0 && target < story.chapters.length;
  resume ? go(target, { animate: false }) : overview({ animate: false });
  refreshCode();
  ready();
  loadComments();
});

// ---- Checking helpers, for whoever builds the story ------------------------
// storyShow(3) jumps to chapter 3 with no animation, and storyShow(0) to the overview, once the page is ready.
// Both lay the page out first: a background tab doesn't run the ResizeObserver that normally
// re-places boxes when their height changes, so what they measure could be stale.
window.storyShow = async n => {
  await storyReady;
  layout();
  document.body.classList.add("instant");
  n > 0 ? go(n - 1, { animate: false }) : overview({ animate: false });
  setTimeout(() => document.body.classList.remove("instant"), 120);
  // Timers, not requestAnimationFrame: a background tab pauses rAF.
  await new Promise(r => setTimeout(r, 60));
  return n > 0 ? `${n}/${story.chapters.length} ${story.chapters[n - 1].title}` : "overview";
};
// storyLint() lists layout problems: overlapping boxes, frames covering other boxes,
// chapters whose boxes are lost in a mostly empty view, labels on boxes, very long edges.
window.storyLint = async () => {
  await storyReady;
  layout();
  const issues = [];
  const R = Object.fromEntries(layoutItems().map(n => [n.id, rectOf(n.id)]));
  const hit = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  const box = ids => {
    const rs = ids.map(id => R[id]);
    const x = Math.min(...rs.map(r => r.x)), y = Math.min(...rs.map(r => r.y));
    return { x, y, w: Math.max(...rs.map(r => r.x + r.w)) - x, h: Math.max(...rs.map(r => r.y + r.h)) - y };
  };
  const ids = Object.keys(R);
  ids.forEach((a, i) => ids.slice(i + 1).forEach(b => { if (hit(R[a], R[b])) issues.push(`boxes overlap: ${a} and ${b}`); }));
  for (const f of $$(".frame")) {
    const g = groups[+f.dataset.g], own = f.dataset.nodes.split(" ");
    const r = { x: f.offsetLeft, y: f.offsetTop, w: f.offsetWidth, h: f.offsetHeight };
    ids.filter(id => !own.includes(id) && hit(r, R[id])).forEach(id => issues.push(`group "${g.title}" frame covers ${id}`));
  }
  story.chapters.forEach((c, i) => {
    const mine = shownIds(c.nodes);
    const b = box(mine);
    const fill = mine.reduce((sum, id) => sum + R[id].w * R[id].h, 0) / (b.w * b.h);
    const foreign = ids.filter(id => !mine.includes(id) && hit(b, R[id]));
    if (mine.length > 1 && fill < .3) issues.push(`chapter ${i + 1} is spread out: its boxes fill ${Math.round(fill * 100)}% of its view` +
      (foreign.length ? `, which also holds ${foreign.join(", ")}` : "") + ". Move its boxes closer together.");
  });
  $$(".elabel").forEach(l => {
    const r = { x: l.offsetLeft - l.offsetWidth / 2, y: l.offsetTop - l.offsetHeight / 2, w: l.offsetWidth, h: l.offsetHeight };
    ids.filter(id => hit(r, R[id])).forEach(id => issues.push(`edge label "${l.textContent}" (${l.dataset.from}→${l.dataset.to}) sits on ${id}`));
  });
  $$("path.edge").forEach(p => { if (p.getTotalLength() > 1600) issues.push(`edge ${p.dataset.from}→${p.dataset.to} is ${Math.round(p.getTotalLength())}px long`); });
  return issues.length ? issues : ["clean"];
};
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => current < 0 ? overview() : go(current), 120); });
// Images loading or <details> opening change box heights; re-place once per frame.
let layoutQueued = false;
const relayout = () => { if (layoutQueued) return; layoutQueued = true; setTimeout(() => { layoutQueued = false; layout(); }, 16); };
const sizeWatcher = new ResizeObserver(relayout);
$$(".node").forEach(el => sizeWatcher.observe(el));
</script>
</body>
